<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desola - Python & AI Engineer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            --glow: rgba(99, 102, 241, 0.4);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0a0a0f;
        }

        /* 动态渐变背景 */
        .gradient-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1a 100%);
            z-index: -3;
        }

        .gradient-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.12), transparent),
                radial-gradient(ellipse 50% 30% at 50% 80%, rgba(6, 182, 212, 0.1), transparent);
            animation: gradientShift 12s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.8; transform: scale(1.1) rotate(5deg); }
        }

        /* 粒子网格背景 */
        .particles-canvas {
            position: fixed;
            inset: 0;
            z-index: -2;
            opacity: 0.6;
        }

        /* 扫描线效果 */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
        }

        /* 科技网格线 */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* 浮动光球 */
        .floating-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 8s ease-in-out infinite;
            z-index: -1;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary), transparent 70%);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent), transparent 70%);
            bottom: -50px;
            left: -50px;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--secondary), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(20px, -30px) scale(1.05); }
            50% { transform: translate(-10px, 20px) scale(0.95); }
            75% { transform: translate(30px, 10px) scale(1.02); }
        }

        .orb-3 {
            animation: float3 12s ease-in-out infinite;
        }

        @keyframes float3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        /* 主体容器 */
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        /* 毛玻璃卡片 */
        .glass-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 60px 80px;
            text-align: center;
            overflow: hidden;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.1) 0%,
                transparent 50%,
                rgba(99, 102, 241, 0.05) 100%
            );
            pointer-events: none;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* 头像区域 */
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                var(--primary),
                var(--accent),
                var(--secondary),
                var(--primary)
            );
            animation: ringRotate 6s linear infinite;
        }

        @keyframes ringRotate {
            to { transform: rotate(360deg); }
        }

        .avatar-ring-2 {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: conic-gradient(
                from 180deg,
                transparent,
                rgba(99, 102, 241, 0.3),
                transparent
            );
            animation: ringRotate 8s linear infinite reverse;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0a0a0f;
            position: relative;
            z-index: 1;
        }

        .avatar-glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, var(--glow), transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* 文字样式 */
        .name {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            animation: textAppear 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes textAppear {
            to { opacity: 1; }
        }

        .title {
            font-size: 1.1rem;
            font-weight: 500;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: textAppear 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .bio {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.7;
            max-width: 480px;
            margin: 0 auto 30px;
            animation: textAppear 0.8s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* 技术栈标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            animation: textAppear 0.8s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .tag {
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* 社交链接 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            animation: textAppear 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .social-link {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .social-link:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: #fff;
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
        }

        .social-link svg {
            width: 22px;
            height: 22px;
        }

        /* 数据流动画 */
        .data-stream {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .stream-item {
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.4;
            animation: streamFlow 3s ease-in-out infinite;
        }

        .stream-item:nth-child(1) { animation-delay: 0s; }
        .stream-item:nth-child(2) { animation-delay: 0.5s; }
        .stream-item:nth-child(3) { animation-delay: 1s; }
        .stream-item:nth-child(4) { animation-delay: 1.5s; }
        .stream-item:nth-child(5) { animation-delay: 2s; }

        @keyframes streamFlow {
            0%, 100% { opacity: 0.2; transform: translateX(0); }
            50% { opacity: 0.6; transform: translateX(-5px); }
        }

        .stream-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .stream-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        /* 底部装饰线 */
        .bottom-line {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            animation: lineAppear 1s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes lineAppear {
            to { opacity: 1; }
        }

        .line-segment {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
        }

        .line-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 2px;
        }

        /* 角落装饰 */
        .corner-decor {
            position: fixed;
            width: 100px;
            height: 100px;
            border: 1px solid rgba(99, 102, 241, 0.1);
            pointer-events: none;
        }

        .corner-tl {
            top: 30px;
            left: 30px;
            border-right: none;
            border-bottom: none;
        }

        .corner-br {
            bottom: 30px;
            right: 30px;
            border-left: none;
            border-top: none;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .glass-card {
                padding: 40px 30px;
                margin: 20px;
            }

            .name {
                font-size: 2rem;
            }

            .avatar-container {
                width: 120px;
                height: 120px;
            }

            .avatar {
                width: 120px;
                height: 120px;
            }

            .data-stream {
                display: none;
            }

            .corner-decor {
                display: none;
            }
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #0a0a0f;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(99, 102, 241, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-overlay" id="loader">
        <div class="loader"></div>
    </div>

    <!-- 背景层 -->
    <div class="gradient-bg"></div>
    <canvas class="particles-canvas" id="particles"></canvas>
    <div class="grid-overlay"></div>
    <div class="scanlines"></div>

    <!-- 浮动光球 -->
    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>

    <!-- 角落装饰 -->
    <div class="corner-decor corner-tl"></div>
    <div class="corner-decor corner-br"></div>

    <!-- 数据流 -->
    <div class="data-stream">
        <div class="stream-item"><span class="stream-dot"></span><span class="stream-text">SYS.ON</span></div>
        <div class="stream-item"><span class="stream-dot"></span><span class="stream-text">ML.MODEL</span></div>
        <div class="stream-item"><span class="stream-dot"></span><span class="stream-text">DATA.FLOW</span></div>
        <div class="stream-item"><span class="stream-dot"></span><span class="stream-text">API.LIVE</span></div>
        <div class="stream-item"><span class="stream-dot"></span><span class="stream-text">LOG.OK</span></div>
    </div>

    <!-- 主体内容 -->
    <div class="container">
        <div class="glass-card">
            <div class="avatar-container">
                <div class="avatar-ring-2"></div>
                <div class="avatar-ring"></div>
                <div class="avatar-glow"></div>
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Desola&backgroundColor=c0aede" alt="Desola" class="avatar">
            </div>
            
            <h1 class="name">Desola</h1>
            <p class="title">Python & AI Engineer</p>
            <p class="bio">

            </p>
            
            <div class="tags">
                <span class="tag">Python</span>
                <span class="tag">PyTorch</span>
                <span class="tag">TensorFlow</span>
                <span class="tag">MLOps</span>
                <span class="tag">Data Science</span>
                <span class="tag">Deep Learning</span>
            </div>
            
            <div class="social-links">

                    </svg>
                </a>
                <a href="#" class="social-link" title="LinkedIn">
                    <svg viewBox="0 0 24 24" fill="currentColor">

                <a href="#" class="social-link" title="Twitter">
                    <svg viewBox="0 0 24 24" fill="currentColor">

        </div>

    <!-- 底部装饰 -->
    <div class="bottom-line">
        <div class="line-segment"></div>
        <span class="line-text">VERSION 2.0.26</span>
        <div class="line-segment"></div>
    </div>

    <script>
        // 粒子系统
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.hue = Math.random() * 60 + 220; // 220-280 (blue to purple range)
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.min(80, Math.floor((canvas.width * canvas.height) / 15000));
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(99, 102, 241, ${0.15 * (1 - distance / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            connectParticles();
            animationId = requestAnimationFrame(animate);
        }

        // 初始化
        resizeCanvas();
        initParticles();
        animate();

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        // 加载完成后隐藏加载动画
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 500);
        });

        // 鼠标交互
        document.addEventListener('mousemove', (e) => {
            particles.forEach(particle => {
                const dx = e.clientX - particle.x;
                const dy = e.clientY - particle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100) {
                    particle.opacity = Math.min(0.8, particle.opacity + 0.02);
                }
            });
        });
    </script>
</body>
</html>
